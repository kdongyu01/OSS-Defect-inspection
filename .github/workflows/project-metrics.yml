name: Collect GitHub Project metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Project snapshot
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_OWNER: kdongyu01
          PROJECT_NUMBER: "4"
        run: python scripts/export_project_metrics.py
      - name: Calculate metrics
        run: python scripts/analyze_project_metrics.py
      - name: Upload Project metrics
        uses: actions/upload-artifact@v4
        with:
          name: project-metrics
          path: metrics/
      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          if git diff --cached --quiet; then
            echo "No Project metric changes to commit"
            exit 0
          fi
          git commit -m "docs: update Project metrics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
